# Render Infrastructure as Code Blueprint for TerraScope Backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: terrascope-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn \"backend.app:create_app()\" --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000,http://127.0.0.1:5500,http://localhost:5000"
